name: CI

on:
  push:
    branches: [main]
  # Pre-merge gate. Scoped to PRs that target main so a PR between two topic
  # branches does not burn a runner on a merge that cannot reach production.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Deliberately runs with NO secrets in the environment. Every module reads
      # env lazily inside functions, so the build must succeed without Doppler --
      # if someone adds a module-scope `process.env.X!` this step is what catches
      # it, rather than a failed deploy.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.hazlsolutions.com
