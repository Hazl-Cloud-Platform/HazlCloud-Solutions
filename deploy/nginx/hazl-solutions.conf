# nginx site for www.hazlsolutions.com.
#
# This box is SHARED with smswebpages.hazl.ca, so everything here is scoped to
# its own server blocks. Nothing in this file belongs in the http{} context.

# Apex -> www. The live site already 308s this way, so changing it would break
# every existing link and the search index.
server {
    listen 80;
    listen 443 ssl http2;
    server_name hazlsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/www.hazlsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hazlsolutions.com/privkey.pem;

    return 308 https://www.hazlsolutions.com$request_uri;
}

server {
    listen 80;
    server_name www.hazlsolutions.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.hazlsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/www.hazlsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hazlsolutions.com/privkey.pem;

    # A generated mockup is ~15KB of HTML inside an SSE frame.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # --- Required for the studio's SSE stream ---
        # The default HTTP/1.0 upstream breaks streaming outright; this is the
        # omission that bites first.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # Without this nginx buffers the whole response and every generation
        # looks frozen until it finishes.
        proxy_buffering off;
        proxy_cache off;
        # A first generation takes 60-100s. The default 60s read timeout would
        # cut it just before it finishes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Cloudflare is currently DNS-only for hazlsolutions.com (grey cloud): the apex
# A records point at the origin, not at Cloudflare, so $remote_addr is already
# the real visitor.
#
# THE MOMENT the orange cloud is switched on, $remote_addr becomes a Cloudflare
# edge IP and every visitor collapses into a handful of hashes -- at which point
# the per-IP caps become global caps and one visitor's three sessions lock out
# the entire internet. Uncomment this block at the same time, and refresh the
# ranges from https://www.cloudflare.com/ips/ periodically.
